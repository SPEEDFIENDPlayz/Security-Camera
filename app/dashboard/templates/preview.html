{% extends 'base.html' %}{% block body %}<h1>Low-resolution preview: {{camera_id}}</h1><video controls autoplay muted width="640" src="/preview-files/{{camera_id}}/index.m3u8"></video><p>If this browser cannot play the HLS sub-stream directly, preview is unavailable in zero-transcode mode.</p><form id="stop" method="post" action="/preview/{{camera_id}}/stop"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button>Stop preview</button></form><script>addEventListener('pagehide',()=>{const f=new FormData();f.append('csrf_token','{{csrf_token()}}');navigator.sendBeacon('/preview/{{camera_id}}/stop',f)})</script>{% endblock %}
